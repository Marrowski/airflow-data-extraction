name: CI-CD Pipeline

on:
  push:
    branches:
      - master
      - 'feature/*'

  pull_request:
    branches:
      - master

  workflow_dispatch:

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Get changed files
        id: changed-files-build
        uses: tj-actions/changed-files@v45
        continue-on-error: true
        with:
          files: |
            Dockerfile
            requirements.txt
      - name: Set run flag
        id: run-flag-build
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ steps.changed-files-build.outputs.any_changed }}" == "true" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi
      - name: Set up Docker Buildx
        if: steps.run-flag-build.outputs.should_run == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Log in to DockerHub
        if: steps.run-flag-build.outputs.should_run == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Build and push Docker image
        if: steps.run-flag-build.outputs.should_run == 'true'
        run: |
          docker buildx build --push \
            --tag ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}:latest \
            --tag ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}:${{ github.sha }} \
            .

  unit-and-integration-and-e2e-tests:
    runs-on: ubuntu-latest
    needs: build-and-push-image
    env:
      AIRFLOW_VAR_API_KEY: ${{ secrets.AIRFLOW_VAR_API_KEY }}
      AIRFLOW_VAR_CHANNEL_HANDLER: ${{ vars.AIRFLOW_VAR_CHANNEL_HANDLER }}
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
      DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
      IMAGE_TAG: ${{ vars.IMAGE_TAG }}
      POSTGRES_CONN_USERNAME: ${{ secrets.POSTGRES_CONN_USERNAME }}
      POSTGRES_CONN_PASSWORD: ${{ secrets.POSTGRES_CONN_PASSWORD }}
      POSTGRES_CONN_HOST: postgres
      POSTGRES_CONN_PORT: 5432
      METADATA_DATABASE_NAME: ${{ vars.METADATA_DATABASE_NAME }}
      METADATA_DATABASE_USERNAME: ${{ secrets.METADATA_DATABASE_USERNAME }}
      METADATA_DATABASE_PASSWORD: ${{ secrets.METADATA_DATABASE_PASSWORD }}
      CELERY_BACKEND_NAME: ${{ vars.CELERY_BACKEND_NAME }}
      CELERY_BACKEND_USERNAME: ${{ secrets.CELERY_BACKEND_USERNAME }}
      CELERY_BACKEND_PASSWORD: ${{ secrets.CELERY_BACKEND_PASSWORD }}
      AIRFLOW_DATABASE_NAME: ${{ vars.AIRFLOW_DATABASE_NAME }}
      AIRFLOW_DATABASE_USERNAME: ${{ secrets.AIRFLOW_DATABASE_USERNAME }}
      AIRFLOW_DATABASE_PASSWORD: ${{ secrets.AIRFLOW_DATABASE_PASSWORD }}
      AIRFLOW_UID: "50000"
      _AIRFLOW_WWW_USER_USERNAME: ${{ vars.AIRFLOW_WWW_USER_USERNAME }}
      _AIRFLOW_WWW_USER_PASSWORD: ${{ secrets.AIRFLOW_WWW_USER_PASSWORD }}
      FERNET_KEY: ${{ secrets.FERNET_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Get changed files
        id: changed-files-tests
        uses: tj-actions/changed-files@v45
        continue-on-error: true
        with:
          files: |
            dags/**
            include/**
            docker-compose.yaml
            Dockerfile
            requirements.txt
      - name: Set run flag
        id: run-flag-tests
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ steps.changed-files-tests.outputs.any_changed }}" == "true" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi
      - name: Set up Docker Compose
        if: steps.run-flag-tests.outputs.should_run == 'true'
        run: docker compose up -d
      - name: Run Unit and Integration Tests
        if: steps.run-flag-tests.outputs.should_run == 'true'
        run: docker exec -it airflow-airflow-worker-1 sh -c "pytest tests/ -v"
      - name: Run End-to-End DAG Tests
        if: steps.run-flag-tests.outputs.should_run == 'true'
        run: |
          DAG_NAMES=("produce_json" "update_db" "data_check")
          for DAG in "${DAG_NAMES[@]}"; do
            docker exec -t airflow-airflow-worker-1 sh -c "airflow dags test $DAG"
          done
      - name: Tear down Docker Compose
        if: steps.run-flag-tests.outputs.should_run == 'true'
        run: docker compose down
